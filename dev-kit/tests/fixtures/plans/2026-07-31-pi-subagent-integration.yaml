spec: docs/specs/2026-07-31-pi-subagent-integration.md
status: done
mode: inline
worktree: .dev-kit/worktrees/2026-07-31-pi-subagent-integration

goal: >-
  Installing the optional local Pi package and reloading exposes a model-selectable,
  profile-bounded subagent tool, while the base dev-kit package still routes Pi to inline.

context:
  - "The approved spec is committed as a1feb4d and owns the package boundary, dispatch contract, failure semantics, and accepted test seams at docs/specs/2026-07-31-pi-subagent-integration.md:3-132."
  - "The base Pi package manifest exposes only ./skills at dev-kit/package.json:32-36, so the optional package must remain outside that manifest."
  - "The current Pi mapping declares native dispatch unavailable and forbids recursive shell-launched Pi, while allowing an installed delegation tool to be mapped from its actual schema at dev-kit/skills/using-dev-kit/references/pi-tools.md:14-16."
  - "Plan model values are relative tiers resolved at dispatch time, never model ids, at dev-kit/skills/writing-plans/SKILL.md:101-115."
  - "The existing Pi tests load a TypeScript extension through a fake ExtensionAPI at dev-kit/tests/pi-extension.test.js:22-39, and the current mapping assertions live at dev-kit/tests/platform-tools.test.js:36-44."
  - "Pi package local-path installation is documented at /opt/homebrew/lib/node_modules/@earendil-works/pi-coding-agent/docs/packages.md:27,107-133, and bundled Pi/typebox imports belong in peerDependencies at that file's line 171."
  - "The installed upstream is @earendil-works/pi-coding-agent 0.82.1 (`node -p require(...).version`), whose examples/extensions/subagent/index.ts:4-36 defines isolated subprocesses, three modes, eight tasks, four concurrent, and a 50KB per-task cap."
  - "The upstream runner uses `--mode json -p --no-session` and abort propagation at /opt/homebrew/lib/node_modules/@earendil-works/pi-coding-agent/examples/extensions/subagent/index.ts:294-408; its renderers begin at lines 700 and 744."
  - "`pi list` in this workspace reports only pi-smart-compact and the base dev-kit package, so this session exposes no installed delegation tool and the ready gate must select inline."
  - "The baseline command `node --test dev-kit/tests/*.test.js` passed 64/64 before implementation on commit a1feb4d."

